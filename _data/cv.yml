- title: Research Experience
  type: time_table
  contents:
    - title: Graduate Research Intern
      institution: Sandia National Laboratories
      year: Summer 2026
      description:
        - Continued collaboration with Bobby Baraldi on Sandia's Rapid Optimization Library team, developing proximal operator approximations for non-smooth trust-region optimization.
        - Results to appear in the 2026 CSRI Summer Proceedings.
    - title: Graduate Research Intern
      institution: Sandia National Laboratories
      year: Summer 2025
      description:
        - Collaborated with Bobby Baraldi on Sandia's Rapid Optimization Library team, implementing and theoretically guaranteeing mixed-precision gradient methods for trust-region algorithms in PDE-constrained optimization.
        - Results published in the 2025 CSRI Summer Proceedings.
    - title: Graduate Research on Structured Matrices
      institution: University of Washington (advisor Dr. Heather Wilber)
      year: 2024 - Present
      description:
        - Development and analysis of efficient algorithms for solving linear systems involving highly structured matrices.
        - Developing publicly accessible MATLAB classes designed to enhance numerical efficiency and robustness in computations with such structured matrix classes.
    - title: Graduate Research on Kalman Smoothing and Filtering
      institution: University of Washington (with Dr. Aleksandr Aravkin)
      year: 2024 - Present
      description:
        - Development and theoretical analysis of a hybrid Kalman filtering/smoothing method for systems subject to non-Gaussian error distributions.
    - title: Prosthetic Hand Senior Design Project
      institution: Rice University
      year: 2022 - 2023
      description:
        - Built a prosthetic hand using 3D printing and used machine learning and computer vision to control the hand based on physical touch sensors and a mounted camera.
        - Presented to the Rice Computational and Applied Mathematics department.
    - title: Parameter Estimation Research Project
      institution: Rice University (Prof. Matthias Heinkenschloss)
      year: 2022 - 2023
      description:
        - Implemented the two-compartment Pinsky-Rinzel neuron model for parameter estimation using Pyomo in Python.
    - title: Emory REU - Models Meet Data
      institution: Emory University (Dr. Lars Ruthotto)
      year: Summer 2022
      description:
        - Research on optimal control theory, solving HJB equations with neural networks.
        - Presented to the Emory Mathematics Department.
    - title: PDE and Inverse Problems Directed Reading
      institution: Rice University (Dr. Mario Bencomo and Dr. Jesse Chan)
      year: Spring 2022
      description:
        - Studied finite difference methods for partial differential equations with varying time-stepping methods on inverse problems.

